---
name: Release
on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for GoReleaser to accurately determine changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5' # version matching go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GH_TOKEN }} 
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }} # Needed to push Homebrew formula